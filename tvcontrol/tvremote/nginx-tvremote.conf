# Guest TV remote; reached directly in the LAN and via heissa (tv.heissa.de) over the VPN
server {
    listen 8090;
    listen [::]:8090;
    root /var/www/tvremote;
    index index.php;
    location / { try_files $uri /index.php; }
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
