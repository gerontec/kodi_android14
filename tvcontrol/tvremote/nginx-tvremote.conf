# Guest remotes; reached directly in the LAN and via heissa (tv.heissa.de, de.heissa.de) over the VPN
server {
    listen 8090;
    listen [::]:8090;
    root /var/www/tvremote;
    index index.php;
    rewrite ^/iptv/?$ /iptv.php last;
    rewrite ^/iptv/(de|at|ch|it|us|ru|fr)/?$ /iptv.php?cc=$1 last;
    # browser player for cable channels (via heissa the path arrives as /iptv/cable/...)
    rewrite ^(?:/iptv)?/cable/(\d+)/(index\.m3u8|seg\d+\.ts)$ /cable.php?i=$1&f=$2 last;
    location / { try_files $uri /index.php; }
    location ~ ^/(index|iptv|cable)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location = /lib.php { deny all; }
}
