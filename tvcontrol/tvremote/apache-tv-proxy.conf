# tv.heissa.de - guest TV remote (PHP on kellertreppe, 10.8.0.6:8090 via OpenVPN).
# Access control lives in the app: it trusts X-Forwarded-For only from this proxy (10.8.0.1).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tv.heissa.de

    ProxyRequests Off
    # drop any client-supplied X-Forwarded-For; mod_proxy then sets only the real client IP
    RequestHeader unset X-Forwarded-For early
    ProxyPass        / http://10.8.0.6:8090/ timeout=40
    ProxyPassReverse / http://10.8.0.6:8090/

    CustomLog ${APACHE_LOG_DIR}/tv_access.log combined
    ErrorLog  ${APACHE_LOG_DIR}/tv_error.log

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/heissa.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/heissa.de/privkey.pem
</VirtualHost>
</IfModule>
<VirtualHost *:80>
    ServerName tv.heissa.de
    Redirect permanent / https://tv.heissa.de/
</VirtualHost>
