# Country IPTV relays for the Sharp TV (tv.heissa.de project).
#   https://<cc>.heissa.de/list.m3u          channel list for Kodi (pvr.iptvsimple)
#   https://<cc>.heissa.de/<token>/<b64url>   stream via the country exit (hls_relay.py)
# ch/at/it: relay on ipgate1 (10.9.0.1:18099, Privado exits) over WireGuard; us: local relay (US IP);
# de: list only, the TV plays German streams directly from home.
# lists carry the relay token: home connection (IPv4 + IPv6 prefix) and VPN only
<Directory /var/www/iptv>
    Require ip 178.25.117.246 2a02:810d:4117:7300::/64 10.8.0.0/24 10.9.0.0/24
</Directory>

<Macro IptvCountry $cc $backend>
<VirtualHost *:443>
    ServerName $cc.heissa.de
    DocumentRoot /var/www/iptv/$cc
    ProxyRequests Off
    RequestHeader unset X-Forwarded-For early
    ProxyPass        /list.m3u !
    # start page = channel list (browser playback / play on the TV), served by kellertreppe
    ProxyPassMatch   ^/$ http://10.8.0.6:8090/iptv/$cc timeout=60
    ProxyPass        / $backend/$cc/ timeout=40
    ProxyPassReverse / $backend/$cc/
    CustomLog ${APACHE_LOG_DIR}/iptv_access.log combined
    ErrorLog  ${APACHE_LOG_DIR}/iptv_error.log
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/heissa.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/heissa.de/privkey.pem
</VirtualHost>
<VirtualHost *:80>
    ServerName $cc.heissa.de
    Redirect permanent / https://$cc.heissa.de/
</VirtualHost>
</Macro>
Use IptvCountry ch http://10.9.0.1:18099
Use IptvCountry at http://10.9.0.1:18099
Use IptvCountry it http://10.9.0.1:18099
Use IptvCountry us http://127.0.0.1:18099
# ru: everything through the US relay (EU blocks some Russian channels)
Use IptvCountry ru http://127.0.0.1:18099
UndefMacro IptvCountry

<VirtualHost *:443>
    ServerName de.heissa.de
    DocumentRoot /var/www/iptv/de
    # cable + German IPTV frontend on kellertreppe (iptv.php plays in Kodi); lists served here
    ProxyRequests Off
    RequestHeader unset X-Forwarded-For early
    ProxyPass        /list.m3u !
    ProxyPass        /all.m3u !
    ProxyPass        / http://10.8.0.6:8090/iptv/ timeout=60
    ProxyPassReverse / http://10.8.0.6:8090/iptv/
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/heissa.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/heissa.de/privkey.pem
</VirtualHost>
<VirtualHost *:80>
    ServerName de.heissa.de
    Redirect permanent / https://de.heissa.de/
</VirtualHost>

