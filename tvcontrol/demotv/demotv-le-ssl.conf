# demotv.heissa.de - public demo: static player page only; the video comes from the broadcaster's CDN,
# so viewers cost this server a few KB each (no relay, no login).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName demotv.heissa.de
    DocumentRoot /var/www/demotv
    <Directory /var/www/demotv>
        Require all granted
        Options -Indexes
    </Directory>
    Header always set Cache-Control "public, max-age=300"
    CustomLog ${APACHE_LOG_DIR}/demotv_access.log combined
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/heissa.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/heissa.de/privkey.pem
</VirtualHost>
</IfModule>
<VirtualHost *:80>
    ServerName demotv.heissa.de
    Redirect permanent / https://demotv.heissa.de/
</VirtualHost>
